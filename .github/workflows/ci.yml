name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      # Report every version's result rather than stopping at the first red one:
      # a failure on the oldest and the newest mean different things.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # No uv.lock is committed — this is a template meant to be copied and
          # re-resolved — so the cache keys off the dependency declaration.
          cache-dependency-glob: python/pyproject.toml

      - name: Install
        run: uv sync --dev --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type check
        # Unpinned target: mypy checks against the interpreter it runs under, so
        # the 3.11 job is what guarantees the floor in requires-python.
        run: uv run mypy src

      - name: Test
        run: uv run pytest
