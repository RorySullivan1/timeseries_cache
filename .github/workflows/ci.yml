name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: ${{ matrix.os }} · python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every combination rather than stopping at the first red one: a
      # failure on the oldest version, the newest, or one OS and not the other
      # all mean different things.
      fail-fast: false
      matrix:
        # Windows earns its place here. POSIX and Windows disagree about open
        # files — POSIX lets you replace or unlink one, Windows refuses — and
        # that difference has already produced bugs this suite could not reach
        # from Linux, including writes to an existing key failing outright.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # No uv.lock is committed — this is a template meant to be copied and
          # re-resolved — so the cache keys off the dependency declaration.
          cache-dependency-glob: python/pyproject.toml

      - name: Install
        run: uv sync --dev --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type check
        # Unpinned target: mypy checks against the interpreter it runs under, so
        # the 3.11 job is what guarantees the floor in requires-python.
        run: uv run mypy src

      - name: Test
        run: uv run pytest
